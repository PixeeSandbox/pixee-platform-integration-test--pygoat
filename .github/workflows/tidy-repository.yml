name: Tidy Pull Requests and Branches

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  tidy_repository:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: write
    steps:
      - name: Tidy old pull requests and branches
        uses: actions/github-script@v6
        with:
          script: |
            const maxAgeInMillis = 24 * 60 * 60 * 1000;
            const staleBranchAgeInMillis = 7 * 24 * 60 * 60 * 1000;
            const now = new Date();
            const { owner, repo } = context.repo;
            let closedCount = 0;
            let tidiedBranchCount = 0;

            async function closeOldOpenPullRequests() {
              let totalPRs = 0;
              const iterator = github.paginate.iterator(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                sort: "created",
                direction: "asc",
                per_page: 100,
              });

              for await (const { data: pullRequests } of iterator) {
                totalPRs += pullRequests.length;
                for (const pr of pullRequests) {
                  const createdAt = new Date(pr.created_at);
                  const prAge = now - createdAt;

                  if (prAge <= maxAgeInMillis) {
                    console.log(`Early break: PR #${pr.number} created ${createdAt.toISOString()} is younger than 1 day; remaining open PRs are newer.`);
                    return totalPRs;
                  }

                  console.log(`Closing PR #${pr.number} - "${pr.title}" (created ${createdAt.toISOString()}, age: ${Math.floor(prAge / (1000 * 60 * 60 * 24))} days)`);
                  try {
                    await github.rest.pulls.update({
                      owner,
                      repo,
                      pull_number: pr.number,
                      state: "closed",
                    });
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: pr.number,
                      body: `This pull request was automatically closed because it has been open for more than 1 day.`,
                    });
                    closedCount++;
                  } catch (error) {
                    console.error(`Error closing PR #${pr.number}: ${error}`);
                  }
                }
              }

              return totalPRs;
            }

            async function findAndTidyStaleBranches() {
              const windowEnd = new Date(now.getTime() - staleBranchAgeInMillis);
              const windowStart = new Date(now.getTime() - 2 * staleBranchAgeInMillis);
              const startStr = windowStart.toISOString().slice(0, 10);
              const endStr = windowEnd.toISOString().slice(0, 10);
              const q = `repo:${owner}/${repo} is:pr is:closed closed:${startStr}..${endStr}`;
              console.log(`Searching closed PRs in window ${startStr}..${endStr}`);

              const branchesChecked = new Set();
              const iterator = github.paginate.iterator(github.rest.search.issuesAndPullRequests, {
                q,
                per_page: 100,
              });

              for await (const { data: items } of iterator) {
                console.log(`Processing ${items.length} closed PRs from search results`);
                for (const item of items) {
                  let pr;
                  try {
                    const { data } = await github.rest.pulls.get({
                      owner,
                      repo,
                      pull_number: item.number,
                    });
                    pr = data;
                  } catch (error) {
                    console.error(`Error fetching PR #${item.number}: ${error}`);
                    continue;
                  }

                  if (branchesChecked.has(pr.head.ref)) continue;
                  branchesChecked.add(pr.head.ref);

                  if (pr.head.repo?.fork) continue;
                  if (pr.head.ref === 'master' || pr.head.ref === 'main') continue;

                  const closedAt = new Date(pr.closed_at);
                  const ageAfterClosed = now - closedAt;
                  if (ageAfterClosed <= staleBranchAgeInMillis) continue;

                  try {
                    await github.rest.repos.getBranch({
                      owner,
                      repo,
                      branch: pr.head.ref,
                    });
                  } catch (branchError) {
                    continue;
                  }

                  console.log(`Tidying stale branch "${pr.head.ref}" from PR #${pr.number} (closed ${Math.floor(ageAfterClosed / (1000 * 60 * 60 * 24))} days ago)`);
                  try {
                    await github.rest.git.deleteRef({
                      owner,
                      repo,
                      ref: `heads/${pr.head.ref}`,
                    });
                    tidiedBranchCount++;
                  } catch (error) {
                    console.error(`Error tidying branch ${pr.head.ref}: ${error}`);
                  }
                }
              }

              if (branchesChecked.size === 0) {
                console.log('No stale branches in the window.');
              }
              return branchesChecked.size;
            }

            const totalPRs = await closeOldOpenPullRequests();
            console.log(`Processed ${totalPRs} open PRs. Closed ${closedCount} PRs that were older than 1 day.`);

            const branchesChecked = await findAndTidyStaleBranches();
            console.log(`Checked ${branchesChecked} branches from closed PRs. Tidied ${tidiedBranchCount} stale branches that were older than 7 days.`);
